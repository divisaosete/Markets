name: Publicar beta no GitHub Pages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'public/**'
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Instalar dependências de verificação
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes e dependências
        run: |
          python tests/run_checks.py
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Construir somente arquivos públicos
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          ENABLE_DIRECT_FX: ${{ vars.ENABLE_DIRECT_FX || 'true' }}
        run: python -m backend.build_pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
