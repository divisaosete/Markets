name: Atualizar dados públicos
on:
  workflow_dispatch:
    inputs:
      force:
        description: Reconsultar fontes mesmo antes do intervalo previsto
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: update-public-data
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Instalar dependências do coletor
        run: python -m pip install -r requirements.txt
      - name: Restaurar intervalos e limites de requisições
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            var/pages-state.json
            var/pages.sqlite3
          key: pages-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-state-
      - name: Coletar fontes aprovadas preservando histórico em falhas
        env:
          FORCE_COLLECTION: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_COLLECTION" = "true" ]; then
            python -m backend.pages --force
          else
            python -m backend.pages
          fi
          python -m backend.pages --validate-only
          python -m backend.build_pages
      - name: Registrar somente o JSON público validado
        id: commit
        run: |
          git add -- public/data/market-data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualizar dados públicos de fontes oficiais'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resumir falhas das fontes sem expor credenciais
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('var/pages-collection-report.json')
          if path.exists():
              report = json.loads(path.read_text())
              failures = [r['id'] for r in report['results'] if r['result'] == 'FAIL']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f"Séries com histórico: {report['available']}/{report['series']}\n\n")
                  out.write('Fontes com falha (histórico anterior preservado): ' + ', '.join(failures) if failures else 'Coleta sem falhas reportadas.')
          PY
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.collect.outputs.ref }}
